 const save=async()=>{const np=$('#np').value,cp=$('#cp').value,lr=$('#lr'),sp=$('#sp');if(np.length<12){lr.textContent='Use at least 12 characters for your password.';return}if(np.length>128){lr.textContent='Use no more than 128 characters.';return}if(np!==cp){lr.textContent='The passwords do not match.';return}

 l.innerHTML='<div class=auth-main><section class=welcome><div class=welcome-copy><p class=story-kicker>MAHINDA COLLEGE · GALLE</p><h1 class=story-title>Discipline.<br><span>Unity.</span><br>Music.</h1><p class=story-copy>Welcome to the home of the Western Cadet Band. Keep your band life organised, stay connected with your section, and prepare for every parade and performance.</p><div class=motto><span class=motto-label>School motto</span><strong>Strive with dedication, grow in wisdom.</strong></div></div><figure class=crest-frame><img class=crest-image src="assets/mahinda-western-cadet-band-crest.svg" alt="Mahinda College Western Cadet Band crest"><figcaption class=crest-caption>Mahinda College · Western Cadet Band</figcaption></figure></section><section class=auth-panel><p class=panel-kicker>Band member access</p><h2>Welcome back</h2><p class=auth-intro>Sign in to open your band dashboard.</p><label for=em>Student ID or teacher email</label><input id=em type=text autocomplete=username><label for=pw>Password</label><input id=pw type=password autocomplete=current-password><p class=bad id=lr role=alert>' + E(msg||(!CFG.url||!CFG.key?'System is not configured. Contact the administrator.':'')) + '</p><button id=lb ' + (CFG.url&&CFG.key?'':'disabled') + '>Sign in</button><p class=auth-note>Students: use your enrolment number. Teachers: use your email address. Contact your Bandmaster if you need help with access.</p></section><footer class=auth-footer><span>STRIVE WITH DEDICATION, GROW IN WISDOM</span><span>WESTERN CADET BAND · MAHINDA COLLEGE</span></footer></div>';

function editReview(i){const r=D.reviews.find(x=>x.id==i)||{};form('Edit promotion review',[{k:'recommendation',l:'Recommendation',o:['','Recommend promotion','Do not recommend','Defer'],d:r.recommendation},{k:'notes',l:'Notes / rationale',a:1,d:r.notes}],async v=>{await put('reviews',{...r,...v});await log('Updated promotion review for '+S(r.student_id).enrolment_no)})}
function newRev(){form('Open promotion review',[{k:'sid',l:'Member',o:D.students.filter(s=>s.status=='Active').map(s=>({v:s.id,t:s.name+' · '+s.rank}))}],async v=>{const s=S(v.sid),n=RANKS[RANKS.indexOf(s.rank)+1];if(!n)return'Already at the top rank';if(D.reviews.some(r=>r.student_id==s.id&&/Draft|Submitted/.test(r.status)))return'An open review already exists';const x=D.assessments.filter(a=>a.student_id==s.id).sort((a,b)=>a.date<b.date?1:-1)[0];
await put('reviews',{id:id(),student_id:s.id,from_rank:s.rank,proposed_rank:n,evidence:{attendance:att(s.id),exam:x?x.score+'/'+x.max_score:null,level:s.level},recommendation:'',notes:'',status:'Draft',reviewed_by:null,reviewed_on:null,decided_by:null,decided_on:null});await log('Opened promotion review for '+s.enrolment_no)})}
function recRev(i){const r=D.reviews.find(x=>x.id==i);form('Record recommendation',[{k:'rec',l:'Recommended action',o:['Recommend promotion','Do not recommend','Defer']},{k:'n',l:'Rationale / conditions / next review date',a:1}],async v=>{if(!v.n)return'Rationale required';await put('reviews',{...r,recommendation:v.rec,notes:v.n,status:'Submitted',reviewed_by:role,reviewed_on:today()});await log('Submitted promotion review for approval')})}
function decide(i,y){const r=D.reviews.find(x=>x.id==i);form(y?'Approve promotion':'Defer / decline',[{k:'n',l:'Rationale',a:1},...(y?[]:[{k:'d',l:'Next review date',t:'date'}])],async v=>{if(!v.n)return'Rationale required';const s=S(r.student_id);if(y){await put('students',{...s,rank:r.proposed_rank});await put('rank_history',{id:id(),student_id:s.id,from_rank:r.from_rank,to_rank:r.proposed_rank,effective_on:today(),approved_by:role,rationale:v.n})}
await put('reviews',{...r,status:y?'Approved':'Deferred',decided_by:role,decided_on:today(),notes:r.notes+' | Decision: '+v.n+(v.d?' (next review '+v.d+')':'')});await log((y?'Approved':'Deferred')+' promotion for '+s.enrolment_no)})}
const csv=(n,r)=>{if(!r.length)return;const k=Object.keys(r[0]),c=v=>{v=String(v??'');if(/^[=+\-@]/.test(v.trimStart()))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([k.join(',')+'\n'+r.map(x=>k.map(y=>c(x[y])).join(',')).join('\n')],{type:'text/csv'}));a.download=n+'.csv';a.click()};
function reports(){return `<h1>Reports</h1><div class=sub>CSV exports</div><div class="card row"><button onclick="csv('members',D.students.map(s=>({enrolment_no:s.enrolment_no,name:s.name,grade:s.grade,section:s.section,instrument:s.instrument,rank:s.rank,attendance_pct:att(s.id)})))">Members + attendance</button><button onclick="csv('assets',D.assets)">Asset register</button><button onclick="csv('audit',D.audit)">Audit log</button></div>`}
async function refreshAccounts(){if(!isDeveloper())return;accountError='';try{accountUsers=await api('GET','profiles',0,'?select=id,full_name,email,role,active&order=full_name')}catch(x){accountError=x.message;accountUsers=[]}render()}
function accounts(){if(!CFG.url)return `<h1>Accounts</h1><div class=sub>Teacher, student, and developer sign-in accounts</div><div class=card>Account management is available after connecting this app to Supabase and deploying the account function.</div>`;if(!isDeveloper())return `<h1>Accounts</h1><div class=sub>Teacher, student, and developer sign-in accounts</div><div class=card>Only developers can invite or delete accounts.</div>`;return `<h1>Accounts</h1><div class=sub>Teacher, student, and developer sign-in accounts</div><div class=row><button onclick="addAccount()">+ Invite account</button><button class=s onclick="refreshAccounts()" title="Refresh accounts">↻ Refresh</button></div>${accountError?`<p class=bad role=alert>${E(accountError)}</p>`:''}<div class="card tw"><table><tr><th>Name<th>Email access<th>Role<th>Status<th>Actions${accountUsers.map(a=>`<tr><td>${E(a.full_name)}<td>${E(a.email||'Invitation sent')}<td>${a.role=='teacher'?'Teacher':a.role=='developer'?'Developer':'Student'}<td>${a.active?'Active':'Inactive'}<td>${a.id!==user.uid?`<button class=s onclick="deleteAccount('${a.id}')">Delete account</button>`:'Current account'}`).join('')}</table></div>`}
async function deleteAccount(i){if(!isDeveloper())return;const a=accountUsers.find(x=>x.id==i);if(!a||a.id==user.uid)return;if(!confirm(`Delete ${a.full_name} (${a.email})? Their sign-in and profile will be removed; any linked student record will remain but become unlinked.`))return;try{const response=await fetch(CFG.url+'/functions/v1/manage-account',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+TOK,'Content-Type':'application/json'},body:JSON.stringify({action:'delete',user_id:i})});const result=await response.json();if(!response.ok){alert(result.error||'Could not delete the account');return}accountUsers=accountUsers.filter(x=>x.id!=i);await log('Deleted account '+a.email);render()}catch(x){alert(x.message||'Could not reach the account service')}}
function addAccount(){if(!isDeveloper())return;form('Invite account',[{k:'name',l:'Full name'},{k:'email',l:'Email address',t:'email'},{k:'role',l:'Account type',o:[{v:'member',t:'Student'},{v:'teacher',t:'Teacher'},{v:'developer',t:'Developer'}],d:'member'},{k:'student_id',l:'Student record (for student accounts)',o:[{v:'',t:'Select a student'},...D.students.filter(s=>!s.user_id).map(s=>({v:s.id,t:s.name+' · '+s.enrolment_no}))],d:''}],async v=>{if(!v.name||!v.email)return'Name and email are required';if(v.role=='member'&&!v.student_id)return'Select the student record to link';try{const response=await fetch(CFG.url+'/functions/v1/manage-account',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+TOK,'Content-Type':'application/json'},body:JSON.stringify({action:'invite',name:v.name,email:v.email,role:v.role,student_id:v.student_id})});const result=await response.json();if(!response.ok)return result.error||'Could not send the invitation';accountUsers.push({...result.account,email:v.email});if(result.student_id){const s=S(result.student_id);if(s.id)s.user_id=result.account.id}await log('Invited '+(v.role=='member'?'student':v.role)+' account '+v.email);accountError=''}catch(x){return x.message||'Could not reach the account service'}})}function settings(){return `<h1>Settings</h1><div class=card><label for=theme>Appearance</label><select id=theme onchange="setTheme(this.value)"><option value=system ${theme=='system'?'selected':''}>System preference</option><option value=light ${theme=='light'?'selected':''}>Light</option><option value=dark ${theme=='dark'?'selected':''}>Dark</option></select><p class=sub>Choose whether the system follows your device setting or always uses light or dark mode.</p><p>Data store: <b>${CFG.url?'Cloud database (Supabase)':'Supabase is not configured'}</b></p><p class=sub>Configure the Supabase project URL and publishable key in this app. Apply the database schema and security migrations, deploy the manage-account and auth-login functions, and configure email delivery plus the app URL in Supabase Auth. Keep the service-role key on the server. Invitation links open a password setup screen in this app.</p></div>`}
const V={dashboard,members,profile,attendance,assess,inventory,notation,promos,reports,settings,accounts},NAV=[['dashboard','Dashboard'],['members','Members'],['attendance','Attendance'],['assess','Assessments'],['inventory','Inventory'],['notation','Notation Library'],['promos','Promotions'],['reports','Reports'],['accounts','Accounts'],['settings','Settings']];
 function render(){const m=user&&user.type=='member',nav=m?[['profile','My profile'],['notation','Notation Library']]:NAV;if(m&&!['profile','notation'].includes(view))view='profile';$('nav').innerHTML=nav.map(([k,l])=>`<a class="${view==k||view=='profile'&&k=='members'?'on':''}" onclick="go('${k}')">${l}</a>`).join('');$('main').innerHTML=m&&view=='profile'&&!sel?'<h1>My profile</h1><div class=sub>No member record is linked to this account yet. Contact the Bandmaster.</div>':V[view]()}
const go=(v,s)=>{if(user&&user.type=='member'&&!['profile','notation'].includes(v))return;view=v;sel=s??null;q='';tab='Overview';render();if(v=='accounts'&&CFG.url)refreshAccounts()};
applyTheme();loginUI();
</script></body></html>
